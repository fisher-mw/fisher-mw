name: Deploy React portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; a new push cancels any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-react/package-lock.json

      - name: Install dependencies
        working-directory: portfolio-react
        run: npm ci

      - name: Build
        working-directory: portfolio-react
        run: npm run build

      # Preserve the custom domain — GitHub Pages requires a CNAME file
      # in the deployed folder to keep fishermw.com pointing here.
      - name: Add CNAME for custom domain
        run: echo "fishermw.com" > portfolio-react/dist/CNAME

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
